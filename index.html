<!DOCTYPE html>
<html lang="es">
<head>

  <title>Cargando Sistema...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #0f172a;
      text-align: center;
    }
  </style>
  <script>
    // REEMPLAZA LA URL DE ABAJO CON LA URL /exec DE TU WEB APP
    var webAppUrl = "https://script.google.com/macros/s/AKfycbwO8d-JmiLTmU5ohB3STigV9FSDJtMIeCQ2sUt53OW4-r15N0g1B_QzJtO9KqNdsERiHw/exec";

    // Forzar la apertura con la cuenta primaria para evitar el bloqueo multicuenta
    if (webAppUrl.indexOf("?") !== -1) {
      window.location.replace(webAppUrl + "&authuser=0");
    } else {
      window.location.replace(webAppUrl + "?authuser=0");
    }
  </script>
</head>
<body>
  <div>
    <h2>Redirigiendo al Sistema de Asistencia...</h2>
